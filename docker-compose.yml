services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense_local_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://stocksense:${POSTGRES_PASSWORD:-stocksense_local_demo}@postgres:5432/stocksense?schema=public
      DIRECT_URL: postgresql://stocksense:${POSTGRES_PASSWORD:-stocksense_local_demo}@postgres:5432/stocksense?schema=public
      AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: http://localhost:8080
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local_demo_access_secret_change_before_deployment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_demo_refresh_secret_change_before_deployment}
      FRONTEND_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Shelfy <noreply@shelfy.local>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
